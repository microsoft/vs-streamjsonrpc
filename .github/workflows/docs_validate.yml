name: 📃 Docfx Validate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - microbuild

jobs:
  build:
    name: 📚 Doc validation
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
      - name: 🔗 Markup Link Checker (mlc)
        uses: becheran/mlc@b74268b49f87c6aaf6ee8d4c6a48d9250cb95b01 # v2.0.0
      - name: ⚙ Install prerequisites
        run: |
          ./init.ps1 -UpgradePrerequisites
          dotnet --info
        shell: pwsh
      - name: 🏭 Build source generator # docfx build needs this to avoid a warning.
        run: dotnet build -c Release src/StreamJsonRpc.Analyzers.CodeFixes
      - name: 📚 Verify docfx build
        run: dotnet docfx docfx/docfx.json --warningsAsErrors --disableGitFeatures
        env:
          DocFx: true # Workaround https://github.com/dotnet/docfx/issues/10808
